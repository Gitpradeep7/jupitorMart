<div class="container">
    <h1>{{product.title}}</h1>
    <div class="img">
        <img src={{product.image}} alt={{product.catergory}}>
    </div>
    <p>{{product.description}}</p>
    <span>Rs {{product.price}}/-</span>
    <h5>{{product.rating.rate}} Rating</h5>
    <span>{{product.rating.count}} left</span>
</div>
