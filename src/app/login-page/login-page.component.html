<div class="container">
  <div class="form-box">
    <h2>login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <input formControlName="email" placeholder="email" />
      <div class="error" *ngIf="loginForm.get('email')?.errors?.['required'] && loginForm.get('email')?.errors?.['touched'] && !loginForm.get('email')?.value">
        <span>{{validations.field}}</span>
      </div>
      <input formControlName="password" type="password" placeholder="Password" /><br />
      <div class="error"
        *ngIf="loginForm.get('password')?.errors?.['required'] && loginForm.get('password')?.errors?.['touched']">
        <span>{{validations.password}}</span>
      </div>
      <button type="submit">Login</button>
    </form>
    <a routerLink="/register">New user? Register here</a>
  </div>
</div>
