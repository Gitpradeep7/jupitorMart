<app-header></app-header>
<div class="search">
    <input type="text" [(ngModel)]="searchItem" placeholder="search here">
</div>
<div class="box">
    <div *ngFor="let product of filteredProducts()" class="card">
        <app-card  [product]="product" ></app-card>
    </div>
    <div class="noProduct" *ngIf="filteredProducts()?.length === 0 ">
    <h1>No result Found</h1>
</div>
</div>
