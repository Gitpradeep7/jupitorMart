
<header class="navbar">

  <div class="logo" routerLink="/home">
    Jupiter
  </div>

  <nav>
    <ul>
      <li routerLink="/cart">
        <span>
          🛒 Cart
          <span class="badge" *ngIf="cartCount.length">{{ cartCount?.length || 0 }}</span>
        </span>
      </li>

      <li class="user">
        👤 {{ currentUser?.name || 'Guest' }}
      </li>

      <li (click)="logout()">
        <span>Logout</span>
      </li>

    </ul>
  </nav>

</header>
